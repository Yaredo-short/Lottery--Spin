<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lottery Spin</title>
<style>
  :root {
    --bg: #12131a;
    --card: #1c1e29;
    --accent: #ff5a5f;
    --text: #f2f2f5;
    --muted: #9a9db0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; text-align: center; }
  .wheel-wrap { position: relative; width: min(85vw, 340px); height: min(85vw, 340px); margin-bottom: 24px; }
  .pointer {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 22px solid var(--accent); z-index: 5;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .wheel {
    width: 100%; height: 100%; border-radius: 50%; position: relative;
    border: 6px solid #2a2d3d;
    transition: transform 6s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04), 0 10px 30px rgba(0,0,0,.5);
  }
  .slice-label {
    position: absolute; top: 50%; left: 50%; width: 50%; height: 2px;
    transform-origin: 0% 50%; display: flex; align-items: center; justify-content: flex-end;
    padding-right: 14px;
  }
  .slice-label span { font-size: 13px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); white-space: nowrap; }
  .hub {
    position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
    background: var(--accent); border-radius: 50%; transform: translate(-50%, -50%);
    z-index: 4; border: 3px solid var(--bg);
  }
  .btn-row { display: flex; gap: 12px; margin-bottom: 6px; }
  button { border: none; font-weight: 700; border-radius: 999px; -webkit-tap-highlight-color: transparent; }
  button#spinBtn {
    background: var(--accent); color: #fff; padding: 16px 40px; font-size: 17px;
    box-shadow: 0 6px 16px rgba(255,90,95,.35);
  }
  button#spinBtn:disabled { background: #3a3d4d; box-shadow: none; color: var(--muted); }
  button#resetBtn { background: transparent; color: var(--muted); padding: 16px 20px; font-size: 14px; border: 1px solid #3a3d4d; }
  .result { margin-top: 22px; text-align: center; min-height: 40px; }
  .result .winner { font-size: 24px; font-weight: 800; color: var(--accent); }
  .result .time { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .panel { margin-top: 20px; width: min(90vw, 340px); background: var(--card); border-radius: 14px; padding: 14px 18px; }
  .panel h2 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .roster { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: #2a2d3d; color: var(--text); border: 1px solid transparent;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .chip.excluded { background: transparent; color: var(--muted); border: 1px solid #3a3d4d; text-decoration: line-through; }
  .chip.won { background: transparent; color: var(--accent); border: 1px solid var(--accent); opacity: 0.7; cursor: default; }
  .history { margin-top: 14px; }
  .history ol { margin: 0; padding-left: 18px; }
  .history li { font-size: 14px; margin-bottom: 4px; }
  .history .t { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .empty-note { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; }
  .status { position: fixed; top: 10px; right: 14px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <div class="status" id="status">connecting…</div>
  <h1>🎉 Lottery Spin</h1>
  <div class="sub">Tap a name below to exclude them before spinning. Winners drop off automatically.</div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="hub"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <div class="btn-row">
    <button id="spinBtn">SPIN</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="result" id="result"></div>
  <div class="empty-note" id="emptyNote" style="display:none;">Nobody left on the wheel — tap Reset to start a new round.</div>

  <div class="panel">
    <h2>Roster (tap to exclude/include)</h2>
    <div class="roster" id="roster"></div>
    <div class="history" id="historyBox" style="display:none;">
      <h2 style="margin-top:14px;">Winners so far</h2>
      <ol id="historyList"></ol>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const wheelEl = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const resetBtn = document.getElementById('resetBtn');
    const resultEl = document.getElementById('result');
    const statusEl = document.getElementById('status');
    const emptyNote = document.getElementById('emptyNote');
    const rosterEl = document.getElementById('roster');
    const historyBox = document.getElementById('historyBox');
    const historyList = document.getElementById('historyList');

    const COLORS = ['#ff5a5f','#ffb400','#3ec1d3','#7b61ff','#2ecc71','#ff8fa3','#5da9ff'];

    function buildWheel(names) {
      wheelEl.style.transition = 'none';
      wheelEl.style.transform = 'rotate(0deg)';
      void wheelEl.offsetHeight;
      wheelEl.style.transition = '';

      wheelEl.querySelectorAll('.slice-label').forEach(el => el.remove());

      if (names.length === 0) {
        wheelEl.style.background = '#2a2d3d';
        return;
      }
      const n = names.length;
      const slice = 360 / n;
      const gradientStops = names.map((_, i) => {
        const start = i * slice, end = start + slice;
        return `${COLORS[i % COLORS.length]} ${start}deg ${end}deg`;
      }).join(', ');
      wheelEl.style.background = `conic-gradient(${gradientStops})`;

      names.forEach((name, i) => {
        const angle = i * slice + slice / 2;
        const label = document.createElement('div');
        label.className = 'slice-label';
        // -90 corrects for rotate() measuring from 3 o'clock while the
        // conic-gradient slices are measured from 12 o'clock — without
        // this, labels sit 90° off from their actual color slice.
        label.style.transform = `rotate(${angle - 90}deg)`;
        label.innerHTML = `<span>${name}</span>`;
        wheelEl.appendChild(label);
      });
    }

    function applySpin(spin) {
      const delay = spin.startAt - Date.now();
      spinBtn.disabled = true;
      resultEl.innerHTML = '';
      const go = () => {
        wheelEl.style.transition = `transform ${spin.duration / 1000}s cubic-bezier(0.17, 0.67, 0.12, 0.99)`;
        wheelEl.style.transform = `rotate(${spin.landingAngle}deg)`;
      };
      if (delay > 0) setTimeout(go, delay); else go();
    }

    function showResult(spin) {
      const dt = new Date(spin.timestamp);
      resultEl.innerHTML = `
        <div class="winner">🏆 ${spin.winner}</div>
        <div class="time">${dt.toLocaleDateString()} • ${dt.toLocaleTimeString()}</div>
      `;
    }

    function renderRoster(allPeople, excluded, winnersHistory) {
      const wonNames = new Set(winnersHistory.map(w => w.name));
      const excludedSet = new Set(excluded);
      rosterEl.innerHTML = allPeople.map(name => {
        if (wonNames.has(name)) {
          return `<div class="chip won">${name} ✓</div>`;
        }
        const isExcluded = excludedSet.has(name);
        return `<div class="chip ${isExcluded ? 'excluded' : ''}" data-name="${name}">${name}</div>`;
      }).join('');

      rosterEl.querySelectorAll('.chip[data-name]').forEach(el => {
        el.addEventListener('click', () => {
          socket.emit('toggleExclude', el.getAttribute('data-name'));
        });
      });
    }

    function renderHistory(list) {
      if (!list || list.length === 0) { historyBox.style.display = 'none'; return; }
      historyBox.style.display = 'block';
      historyList.innerHTML = list.map(w => {
        const dt = new Date(w.timestamp);
        return `<li>${w.name} <span class="t">${dt.toLocaleTimeString()}</span></li>`;
      }).join('');
    }

    function updateControls(pool, spinning) {
      if (pool.length === 0) {
        spinBtn.disabled = true;
        emptyNote.style.display = 'block';
      } else {
        spinBtn.disabled = !!spinning;
        emptyNote.style.display = 'none';
      }
    }

    socket.on('connect', () => statusEl.textContent = 'connected');
    socket.on('disconnect', () => statusEl.textContent = 'reconnecting…');

    socket.on('init', (data) => {
      buildWheel(data.pool);
      renderRoster(data.allPeople, data.excluded, data.winnersHistory);
      renderHistory(data.winnersHistory);
      updateControls(data.pool, data.spinning);
      if (data.currentSpin && data.spinning) {
        resultEl.innerHTML = '<div class="time">Spin in progress…</div>';
      }
    });

    socket.on('spin', (spin) => applySpin(spin));
    socket.on('spinEnd', (spin) => showResult(spin));

    socket.on('state', (data) => {
      renderRoster(data.allPeople, data.excluded, data.winnersHistory);
      renderHistory(data.winnersHistory);
      updateControls(data.pool, data.spinning);
      // Rebuild the wheel slightly after showing the result so the winner's
      // name is still visible for a moment. If it's just an exclude toggle
      // (no spin just happened), rebuild right away.
      if (data.spinning === false && document.querySelector('.winner')) {
        setTimeout(() => buildWheel(data.pool), 1800);
      } else {
        buildWheel(data.pool);
      }
    });

    socket.on('resetDone', () => { resultEl.innerHTML = ''; });

    spinBtn.addEventListener('click', () => socket.emit('startSpin'));
    resetBtn.addEventListener('click', () => socket.emit('resetSpin'));
  </script>
</body>
</html>
